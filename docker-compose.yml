services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market_gap
      POSTGRES_PASSWORD: market_gap
      POSTGRES_DB: market_gap
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_gap"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://market_gap:market_gap@db:5432/market_gap
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  db-data:
